name: Build dive brief

on:
  schedule:
    # Times are UTC; Palau = UTC+9. GitHub delays scheduled runs here by ~3-5 h, so the morning
    # brief is attempted several times overnight; any one of them landing before 08:00 is enough.
    - cron: "11 15 * * *"   # 00:11 Palau
    - cron: "13 17 * * *"   # 02:13 Palau
    - cron: "17 19 * * *"   # 04:17 Palau
    - cron: "41 21 * * *"   # 06:41 Palau
    - cron: "7 9 * * *"     # 18:07 Palau (evening preview for tomorrow)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch last published brief (fallback if a source is down)
        run: |
          mkdir -p docs/data
          curl -fsSL --retry 2 "https://lowis-wong.github.io/palau-dive-brief/data/brief.json" -o docs/data/brief.json \
            || echo "no previous brief"
      - name: Build brief
        run: python scripts/build.py
      - name: Mirror latest brief to the brief-data branch (single commit, for debugging)
        continue-on-error: true
        run: |
          cp docs/data/brief.json "$RUNNER_TEMP/brief.json"
          cd "$RUNNER_TEMP" && rm -rf mirror && mkdir mirror && cd mirror
          git init -q -b brief-data
          cp ../brief.json .
          git add brief.json
          git -c user.name="dive-brief-bot" -c user.email="dive-brief-bot@users.noreply.github.com" \
            commit -q -m "Latest brief $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') Palau"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" brief-data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
